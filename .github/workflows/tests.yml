name: tests

# Run the test suite automatically on every push and pull request to main.
# The suite uses in-memory SQLite, so no Postgres/Redis services are needed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # DATABASE_URL is only needed at import time; conftest also sets a default,
        # but we provide one explicitly so the run is self-describing.
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/test
        run: pytest -q
